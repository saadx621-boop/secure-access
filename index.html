<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SODRX | Cloud Management</title>
    <style>
        body { background: #f4f7f6; color: #333; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin: 0; padding-top: 100px; }
        .container { background: white; width: 450px; margin: auto; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 5px solid #007bff; }
        .btn { background: #007bff; color: white; padding: 15px 35px; border: none; font-size: 16px; cursor: pointer; border-radius: 6px; font-weight: 600; width: 100%; transition: 0.3s; }
        .btn:hover { background: #0056b3; }
        #output { background: #1e1e1e; color: #d4d4d4; text-align: left; padding: 15px; border-radius: 8px; height: 250px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 14px; margin-top: 20px; }
        .status-red { color: #ff4d4d; font-weight: bold; }
    </style>
</head>
<body>

    <div id="welcome" class="container">
        <h2 style="color: #007bff;">SODRX PANEL v2.4</h2>
        <p>Private Secure Connection Required.</p>
        <p style="font-size: 14px; color: #666;">You are attempting to access the SODRX Private Room. Authentication is required to proceed.</p>
        <button class="btn" onclick="startProcess()">AUTHENTICATE & ENTER</button>
    </div>

    <div id="loading" class="container" style="display:none;">
        <h3>Connecting to Secure Node...</h3>
        <div style="border: 4px solid #f3f3f3; border-top: 4px solid #007bff; border-radius: 50%; width: 30px; height: 30px; animation: spin 2s linear infinite; margin: 20px auto;"></div>
        <p>Redirecting to Private Room...</p>
    </div>

    <div id="screen" class="container" style="display:none; width: 600px;">
        <h3 class="status-red">CRITICAL SYSTEM ALERT</h3>
        <div id="output"></div>
    </div>

    <style> @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } } </style>

    <script>
        function startProcess() {
            document.getElementById('welcome').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            // Webhook
            fetch('رابط_الـ_WEBHOOK_حقك_هنا', { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify({content: "🧤 **SODRX:** Target has authenticated. Prank sequence starting!"})
            });

            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('screen').style.display = 'block';
                runSequence();
            }, 3000);
        }

        function runSequence() {
            const out = document.getElementById('output');
            const lines = [
                "[INFO] Established connection to SODRX_PRIVATE_NODE",
                "[WARN] Hardware ID does not match white-list.",
                "[SYS] Running Violation Scan on local machine...",
                "[!] VIOLATION FOUND: Disrespect to Host (Eizima Incident).",
                "[SYS] Initiating Remote Lockdown Protocol...",
                "[SYS] Syncing Minecraft/Steam tokens to cloud...",
                "[SYS] Deleting system32... (Just kidding, or am I?)",
                "[FINAL] STATUS: COMPROMISED. DO NOT REBOOT."
            ];
            let i = 0;
            const timer = setInterval(() => {
                if(i < lines.length) {
                    out.innerHTML += "<p style='margin: 5px 0;'>" + lines[i] + "</p>";
                    out.scrollTop = out.scrollHeight;
                    i++;
                } else {
                    clearInterval(timer);
                    alert("SODRX: Look who's in the private room now! Next time, don't ignore the invitation of someone who knows how to code. 😉");
                }
            }, 1200);
        }
    </script>
</body>
</html>
